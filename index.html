<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field-O-Scope — Living Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&family=League+Spartan:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#43442f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Living Hub">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --kraft:#C4A87C; --kraft-dark:#9C7A4D; --kraft-deep:#6E5631; --cover:#BC9C6E;
  --paper:#FAF8F2; --paper-line:#D9C9A8; --grid:rgba(156,122,77,.13);
  --ink:#1A1A1A; --ink-soft:#46443E; --ink-faint:#9C7A4D;
  --stamp-red:#C2702F; --amber:#D08A3E; --aqua:#7B9BA8; --moss:#8A9A6B; --green:#7F9056;
  --phosphor:#58ffb0; --phosphor-dim:#2fae78; --scope-amber:#ffcc66; --bakelite:#2a2622; --bakelite-hi:#463f37;
  --radius:12px; --shadow-card:0 1px 1px rgba(60,42,18,.10); --mono:'Jost',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--mono);color:var(--ink);line-height:1.5;min-height:100vh;letter-spacing:.01em;
  background:#14151a;
  background-image:radial-gradient(circle at 32% 18%, #21232b, #0e0f13 72%);
  padding:clamp(.6rem,2.5vw,2rem); display:flex; justify-content:center;}
.hub{width:100%; max-width:468px; margin:0 auto;
  --olive:#4d5238;--olive-dk:#393d2a;--olive-hi:#5b6143;
  background:
   radial-gradient(circle at 19px 19px, rgba(0,0,0,.6) 0 2.6px, rgba(255,255,255,.10) 3px 4px, transparent 4.6px),
   radial-gradient(circle at calc(100% - 19px) 19px, rgba(0,0,0,.6) 0 2.6px, rgba(255,255,255,.10) 3px 4px, transparent 4.6px),
   radial-gradient(circle at 19px calc(100% - 19px), rgba(0,0,0,.6) 0 2.6px, rgba(255,255,255,.10) 3px 4px, transparent 4.6px),
   radial-gradient(circle at calc(100% - 19px) calc(100% - 19px), rgba(0,0,0,.6) 0 2.6px, rgba(255,255,255,.10) 3px 4px, transparent 4.6px),
   linear-gradient(157deg, var(--olive-hi), var(--olive) 55%, var(--olive-dk));
  border-radius:16px;
  padding:clamp(1.2rem,3.5vw,2rem);
  box-shadow:0 0 0 3px #e2e5e8, 0 0 0 6px #9aa0a4, 0 0 0 7px #5f6367, 0 22px 52px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.08);}.spread{display:flex;flex-direction:column;gap:1rem;}.col-left,.col-right{min-width:0;}.col-right{display:flex;flex-direction:column;gap:1rem;}@media(min-width:900px){.hub{max-width:1140px;}.spread{display:grid;grid-template-columns:440px 1fr;gap:1.8rem;align-items:stretch;}.col-left{position:relative;}.col-left{position:sticky;top:1.1rem;align-self:start;}.col-right{height:100%;}.col-right .page{margin-top:0;}.col-right #dispatch{flex:1 1 auto;}.brand h1{font-size:2.8rem;}}
.hidden{display:none!important;}

.hub-header{margin-bottom:1.1rem;}
.dataplate{position:relative;background:linear-gradient(160deg,#3f4430,#2f3324);border:1px solid #20231a;border-radius:5px;
  padding:.7rem 1rem .8rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 6px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.4);
  background-image:radial-gradient(circle at 9px 9px,rgba(0,0,0,.5) 0 2px,rgba(255,255,255,.08) 2.4px 3.2px,transparent 3.6px),radial-gradient(circle at calc(100% - 9px) 9px,rgba(0,0,0,.5) 0 2px,rgba(255,255,255,.08) 2.4px 3.2px,transparent 3.6px),radial-gradient(circle at 9px calc(100% - 9px),rgba(0,0,0,.5) 0 2px,rgba(255,255,255,.08) 2.4px 3.2px,transparent 3.6px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),rgba(0,0,0,.5) 0 2px,rgba(255,255,255,.08) 2.4px 3.2px,transparent 3.6px),linear-gradient(160deg,#3f4430,#2f3324);}
.dp-row{display:flex;justify-content:space-between;align-items:baseline;}
.dp-mfr{font-family:var(--sans);font-size:.52rem;font-weight:700;letter-spacing:.24em;color:var(--scope-amber);opacity:.82;}
.dp-no{font-family:var(--mono);font-size:.5rem;letter-spacing:.08em;color:#b9c0a4;opacity:.7;}
.dataplate h1{font-family:var(--sans);font-size:clamp(1.7rem,6.5vw,2.4rem);font-weight:700;letter-spacing:.04em;color:#eef0e4;line-height:1;margin:.2rem 0 .25rem;text-shadow:0 1px 0 rgba(0,0,0,.5),0 0 1px rgba(255,255,255,.2);}
.dp-sub{font-family:var(--sans);font-size:.5rem;font-weight:600;letter-spacing:.18em;color:#aeb59a;opacity:.75;}
.header-verse{font-size:.7rem;color:#f0e3c6;line-height:1.5;margin-top:.6rem;}
.header-verse .verse-ref{display:block;font-weight:700;letter-spacing:.18em;color:var(--scope-amber);margin-bottom:.2rem;font-size:.6rem;}
.header-verse .vk{color:#fff;font-weight:600;}

/* ===== SCOPE ===== */
.scope-unit{background:linear-gradient(160deg,var(--bakelite-hi),var(--bakelite));border:1px solid #15110d;border-radius:8px;
  padding:.7rem .7rem .6rem;box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.10);}
.scope-stencil-top{font-size:.56rem;font-weight:700;letter-spacing:.22em;color:var(--scope-amber);text-align:center;margin-bottom:.5rem;opacity:.85;text-shadow:0 0 4px rgba(255,204,102,.4);}
.scope-bezel{background:radial-gradient(circle at 50% 40%,#3a342d,#1c1814 80%);border-radius:50%;padding:12px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.05);}
.scope-screen{position:relative;border-radius:50%;overflow:hidden;aspect-ratio:1/1;
  background:radial-gradient(circle at 50% 45%,#0d4030 0%,#07271d 55%,#041610 100%);
  box-shadow:inset 0 0 22px rgba(0,0,0,.85),inset 0 0 60px rgba(40,255,160,.06);}
.scope-screen #wheel{position:relative;display:block;width:100%;height:100%;z-index:2;}
#grid-rings polygon{fill:none;stroke:var(--phosphor-dim);stroke-width:.6;opacity:.45;}
#spokes line{stroke:var(--phosphor-dim);stroke-width:.5;opacity:.4;}
#scope-shape{fill:rgba(88,255,176,.16);stroke:var(--phosphor);stroke-width:2;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(88,255,176,.8));transition:all .35s ease;}
#dots circle{fill:var(--phosphor);filter:drop-shadow(0 0 3px rgba(88,255,176,.9));cursor:pointer;transition:r .15s ease;}
#dots circle.active{fill:var(--scope-amber);filter:drop-shadow(0 0 5px rgba(255,204,102,1));}
#labels text{fill:var(--phosphor);font-family:var(--mono);font-weight:600;letter-spacing:.04em;cursor:pointer;opacity:.78;text-shadow:0 0 4px rgba(88,255,176,.7);transition:opacity .15s,fill .15s;}
#labels text.active{fill:var(--scope-amber);opacity:1;}
#scope-sweep{stroke:var(--phosphor);stroke-width:1.2;opacity:.5;transform-box:view-box;transform-origin:160px 160px;animation:sweep 4s linear infinite;filter:drop-shadow(0 0 4px rgba(88,255,176,.8));}
@keyframes sweep{to{transform:rotate(360deg);}}
.scope-scanlines{position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;animation:flicker 3.5s steps(60) infinite;}
@keyframes flicker{0%,100%{opacity:.55;}48%{opacity:.62;}50%{opacity:.48;}}
.scope-glass{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.16),transparent 38%),radial-gradient(circle at 50% 50%,transparent 60%,rgba(0,0,0,.45) 100%);}
.scope-controls{display:flex;align-items:center;justify-content:space-between;margin-top:.55rem;padding:0 .15rem;}
.scope-readout{display:flex;flex-direction:column;line-height:1.05;}
.scope-readout-lbl{font-size:.5rem;font-weight:700;letter-spacing:.16em;color:var(--scope-amber);opacity:.8;}
.scope-readout-val{font-size:1.35rem;font-weight:700;color:var(--phosphor);text-shadow:0 0 6px rgba(88,255,176,.7);font-variant-numeric:tabular-nums;}
.scope-dials{display:flex;align-items:center;gap:8px;}
.scope-knob{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5a5149,#211d19);box-shadow:inset 0 1px 1px rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.6);border:1px solid #15110d;}
.scope-knob::after{content:"";display:block;width:2px;height:7px;margin:1px auto;background:var(--scope-amber);opacity:.6;border-radius:1px;}
.scope-lamp{width:9px;height:9px;border-radius:50%;background:var(--phosphor);box-shadow:0 0 7px var(--phosphor);animation:flicker 2.2s ease-in-out infinite;}

/* ===== TOC ===== */
.page{background:var(--paper);border:1px solid #2c2f22;border-radius:var(--radius);box-shadow:inset 0 2px 5px rgba(0,0,0,.30),0 1px 0 rgba(255,255,255,.18);padding:1.05rem 1.1rem 1.25rem;margin-top:1.1rem;text-align:left;}.page.idxpage{background:linear-gradient(160deg,var(--bakelite-hi),var(--bakelite));border:1px solid #15110d;box-shadow:inset 0 2px 10px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.08);}.idx-stencil{font-family:var(--sans);font-size:.62rem;font-weight:700;letter-spacing:.22em;color:var(--scope-amber);text-align:center;margin-bottom:.75rem;opacity:.88;text-shadow:0 0 4px rgba(255,204,102,.4);}.sidecard{margin-top:.85rem;background:var(--paper);border:1px solid var(--kraft-dark);border-radius:6px;padding:.65rem .8rem;box-shadow:0 6px 15px rgba(38,25,9,.30),inset 0 1px 0 rgba(255,255,255,.55);}.dispatch{margin-top:.95rem;background:#fbf6e9;border:1px solid #2c2f22;border-radius:3px;padding:.7rem .9rem .85rem;box-shadow:inset 0 2px 5px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.18);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(110,80,40,.015) 6px 7px);}.dispatch .dh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--paper-line);padding-bottom:.38rem;margin-bottom:.5rem;}.dispatch .dt{font-family:var(--sans);font-size:.6rem;font-weight:700;letter-spacing:.2em;color:var(--kraft-deep);}.dispatch .dw{font-family:"Special Elite",monospace;font-size:.6rem;color:var(--ink-faint);}.dispatch .re{font-family:'Special Elite',monospace;font-size:.62rem;color:var(--ink-faint);margin-bottom:.4rem;}.dispatch .vt{font-family:'Special Elite',monospace;font-size:.85rem;line-height:1.6;color:var(--ink);}.dispatch .vr{display:block;font-family:'Special Elite',monospace;font-size:.64rem;color:var(--ink-soft);margin-top:.45rem;text-align:right;letter-spacing:.04em;}.legend{display:flex;flex-wrap:wrap;align-items:center;gap:.65rem;font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.05em;color:var(--ink-soft);}.legend .sk{color:var(--kraft-deep);letter-spacing:.16em;}.legend .lg{display:flex;align-items:center;gap:.3rem;}.legend i{width:12px;height:6px;border-radius:1px;display:inline-block;border:1px solid rgba(0,0,0,.15);}
h2.sec{font-size:.8rem;font-weight:800;letter-spacing:.18em;color:var(--kraft-deep);margin:.1rem 0 .7rem;text-align:left;}
.th-bar{display:flex;gap:.35rem;margin:0 0 .5rem;}
#sd-bar{margin:0 0 .5rem;}
.sd-btn{width:100%;cursor:pointer;font-family:'Special Elite',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);background:transparent;border:1px dashed var(--kraft-dark);border-radius:4px;padding:.3rem;}
.sd-btn:hover{background:#fbf4e2;}
.sd-wrap{padding:.2rem 0 .4rem;}
.sd-caught{font-size:.82rem;color:var(--ink-soft);margin-bottom:.7rem;}
.sd-q{font-family:'League Spartan','Jost',sans-serif;font-size:.9rem;font-weight:600;margin-bottom:.35rem;}
#sd-in{width:100%;box-sizing:border-box;padding:.5rem;border:1px solid var(--paper-line);border-radius:4px;font:inherit;}
.sd-row{display:flex;gap:.4rem;margin-top:.45rem;flex-wrap:wrap;}
.sd-put,.sd-go{cursor:pointer;font-family:var(--mono);font-size:.7rem;padding:.4rem .6rem;border:1px solid var(--kraft-dark);border-radius:4px;background:#efe4c8;color:var(--ink);}
.sd-go{background:var(--ink);color:#fbf4e2;border-color:var(--ink);margin-left:auto;}
.sd-msg{font-size:.72rem;color:var(--ink-soft);min-height:1em;margin-top:.35rem;}
.mv-btn{cursor:pointer;font-family:var(--mono);font-size:.72rem;line-height:1;padding:.12rem .35rem;border:1px solid var(--paper-line);border-radius:3px;background:transparent;color:var(--ink-faint);}
.mv-btn:hover{background:#fbf4e2;color:var(--ink);}
.mv-picker{display:none;flex-wrap:wrap;gap:.25rem;padding:.35rem 0 .15rem 1.1rem;}
.mv-picker.open{display:flex;}
.mv-chip{cursor:pointer;font-family:var(--mono);font-size:.6rem;letter-spacing:.03em;padding:.18rem .4rem;border:1px solid var(--kraft-dark);border-radius:3px;background:#f4ecd8;color:var(--ink);}
.mv-chip:hover{background:#fff;}
.mv-chip.cancel{background:transparent;color:var(--ink-faint);border-style:dashed;}
.mv-msg{font-size:.66rem;color:var(--ink-soft);}
.id-rule{font-size:.72rem;line-height:1.55;color:var(--ink-soft);background:#f4ecd8;border-left:2px solid var(--kraft-dark);padding:.4rem .55rem;margin:0 0 .55rem;border-radius:0 3px 3px 0}
.id-row{display:flex;align-items:center;gap:.4rem;padding:.28rem 0;border-top:1px solid var(--paper-line)}
.id-row:first-child{border-top:0}
.id-row{display:block}
.id-line{display:flex;align-items:baseline;gap:.4rem}
.id-t{flex:1}
.gt-wrap{padding:.3rem 0 .5rem}
.gt-idea{font-family:'League Spartan','Jost',sans-serif;font-size:1.02rem;font-weight:600;line-height:1.2;margin-bottom:.35rem}
.gt-step{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.6rem}
.gt-q{font-size:.95rem;font-weight:600;line-height:1.35;margin-bottom:.25rem}
.gt-hint{font-size:.72rem;line-height:1.5;color:var(--ink-soft);opacity:.85;margin-bottom:.6rem}
.gt-opt{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;font-size:.82rem;padding:.5rem .6rem;margin-bottom:.3rem;border:1px solid var(--kraft-dark);border-radius:5px;background:#fbf4e2;color:var(--ink)}
.gt-opt:hover{background:#fff}
.gt-opt.on{background:var(--ink);color:#fbf4e2;border-color:var(--ink)}
.gt-count{font-family:var(--mono);font-size:.68rem;color:var(--ink-soft);margin:.35rem 0}
.gt-next,.gt-do{cursor:pointer;font-family:var(--mono);font-size:.74rem;font-weight:700;letter-spacing:.04em;padding:.45rem .8rem;margin:.15rem .3rem .15rem 0;border:0;border-radius:5px;background:var(--stamp-red);color:#fff}
.gt-ta{width:100%;box-sizing:border-box;font:inherit;font-size:.85rem;padding:.5rem;border:1px solid var(--paper-line);border-radius:5px;margin-bottom:.4rem}
.gt-back{display:inline-block;margin-top:.9rem;font-family:var(--mono);font-size:.68rem;color:var(--ink-soft);text-decoration:none}
.gt-out{display:inline-block;font-family:var(--mono);font-size:.76rem;font-weight:700;letter-spacing:.14em;padding:.22rem .6rem;border-radius:4px;margin-bottom:.45rem}
.gt-out.red{background:#f0dcc4;color:#8a4a1c}
.gt-out.hold{background:#efe4c8;color:#6e5631}
.gt-out.clear{background:#dfe7cf;color:#4a5a2c}
.gt-why{font-size:.82rem;line-height:1.5;color:var(--ink-soft);margin-bottom:.6rem}
.gt-win{background:#f4ecd8;border-left:2px solid var(--kraft-dark);border-radius:0 4px 4px 0;padding:.4rem .55rem;font-size:.82rem;margin-bottom:.6rem}
.gt-win span{display:block;font-family:var(--mono);font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.15rem}
.gt-lbl{font-family:var(--mono);font-size:.62rem;color:var(--ink-soft);margin-right:.3rem}
.gt-msg{font-size:.72rem;color:var(--ink-soft);min-height:1em;margin-top:.4rem}
.arch-row{padding:.45rem 0;border-top:1px solid var(--paper-line)}
.arch-row:first-child{border-top:0}
.arch-top{display:flex;align-items:baseline;gap:.4rem}
.arch-n{flex:1;font-size:.86rem}
.arch-d{font-family:var(--mono);font-size:.62rem;color:var(--ink-faint);margin-top:.1rem}
.arch-w{font-size:.74rem;color:var(--ink-soft);line-height:1.45;margin:.15rem 0 .3rem}
.id-due{font-family:var(--mono);font-size:.6rem;color:var(--ink-faint);white-space:nowrap}
.id-due.now{color:var(--stamp-red);font-weight:700}
.id-due.none{opacity:.55;font-style:italic}
.id-acts{display:flex;gap:.25rem;margin-top:.2rem}
.mv-lbl{font-family:var(--mono);font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6;align-self:center;padding-right:.15rem}
.mv-brk{flex-basis:100%;height:0}
#war-room .mv-chip.aside{border-style:dashed}
#war-room .mv-chip.q{border-color:var(--wr-amber);color:#f2dcb4}
#war-room .mv-btn{border-color:rgba(216,203,160,.4);color:#d8cba0;background:transparent;margin-left:.2rem}
#war-room .mv-btn:hover{background:rgba(216,203,160,.15);color:#f1ead7}
#war-room .mv-picker{padding:.3rem 0 .1rem}
#war-room .mv-chip{background:rgba(216,203,160,.12);border-color:rgba(216,203,160,.4);color:#f1ead7}
#war-room .mv-chip:hover{background:rgba(216,203,160,.28)}
#war-room .mv-msg{color:#d8cba0}
.sd-foot{font-size:.66rem;color:var(--ink-faint);margin-top:.9rem;line-height:1.5;}
.sd-avoid{margin-top:1rem;padding-top:.55rem;border-top:1px solid var(--paper-line);display:flex;flex-wrap:wrap;gap:.3rem;align-items:baseline}
.sd-avoid span{font-family:var(--mono);font-size:.62rem;color:var(--ink-soft);background:#f4ecd8;border:1px solid var(--paper-line);border-radius:3px;padding:.12rem .35rem}
.sd-avoid .sd-al{background:transparent;border:0;padding:0;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;font-size:.55rem;width:100%}.th-btn{flex:1;cursor:pointer;font-family:'League Spartan','Jost',sans-serif;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:.34rem .3rem;border:1px solid var(--kraft-dark);border-radius:4px;background:#efe4c8;color:var(--ink-soft);}.th-btn.on{background:var(--ink);color:#fbf4e2;border-color:var(--ink);}.toc-list{display:flex;flex-direction:column;gap:.3rem;padding-top:.3rem;}.tab-row{display:flex;gap:.35rem;}.tab-row.off{margin-left:0;}.toc-item{position:relative;flex:1 1 0;min-width:0;text-align:left;cursor:pointer;font-family:var(--mono);background:#fbf4e2;border:1px solid var(--kraft-dark);border-top:2px solid var(--kraft);border-radius:5px 5px 2px 2px;padding:.3rem .4rem .32rem;box-shadow:0 1px 0 rgba(0,0,0,.07);transition:transform .1s,background .12s,box-shadow .12s;}.toc-item:hover{background:#fff;transform:translateY(-1px);}.toc-item.active{background:#fffdf6;transform:translateY(-1px);box-shadow:0 2px 5px rgba(60,42,18,.18);}.toc-item .tn{font-size:.52rem;font-weight:800;letter-spacing:.06em;color:var(--kraft-deep);}.toc-item.active .tn{color:var(--stamp-red);}.toc-item .tt{display:block;font-family:'League Spartan','Jost',sans-serif;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);line-height:1.15;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.toc-item.inbox{background:#e7d9bb;border-style:dashed;border-top-color:var(--kraft-deep);}.toc-item.war{background:#f6ecd2;border-top-color:var(--stamp-red);}.toc-item.disc{background:#f2ecdc;border-top-color:var(--green);}.toc-item.flock{background:#f0e8d4;border-top-color:var(--aqua);}.toc-item.idea{background:#efe9db;border-top-color:var(--kraft-deep);border-style:dashed;}.toc-item.war .tt{letter-spacing:.06em;}

/* ===== PANELS (graph paper ledger) ===== */
.ledger-rule{display:flex;justify-content:space-between;align-items:baseline;font-size:.62rem;font-weight:700;letter-spacing:.2em;color:var(--kraft-deep);border-bottom:2px solid var(--kraft-dark);padding-bottom:.4rem;margin:1.4rem 0 .8rem;} .ledger-rule:first-child{margin-top:0;}
.panel{display:none;background:#fffdf6;border:1px solid var(--paper-line);border-radius:6px;padding:1.1rem 1.15rem 1.3rem;}.recordpage{margin-top:1rem;}.rec-cols{display:flex;flex-direction:column;}.rc{min-width:0;}@media(min-width:900px){.rec-cols{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;align-items:start;}.p-head{margin-bottom:.2rem;}}
.panel.show{display:block;}
.p-head{display:flex;align-items:center;gap:.7rem;border-bottom:1px dashed var(--paper-line);padding-bottom:.7rem;}
.spoke-stamp{font-size:.78rem;font-weight:800;color:#fff;background:var(--stamp-red);padding:.25rem .5rem;border-radius:2px;}
.p-head h3{font-size:1rem;font-weight:700;letter-spacing:.04em;}.horizon{font-size:.72rem;font-style:italic;color:var(--ink-soft);margin-top:.15rem;}.horizon .hz{font-style:normal;font-size:.5rem;font-weight:700;letter-spacing:.14em;color:var(--amber);background:#f6ecd6;padding:.05rem .3rem;border-radius:2px;margin-right:.35rem;vertical-align:middle;}.mini-sig{display:flex;flex-direction:column;align-items:center;flex:none;}.gsvg{width:46px;height:28px;display:block;}.mini-val{font-size:.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin-top:-2px;}
.p-head p{font-size:.72rem;color:var(--ink-faint);}
.lblrow{display:flex;align-items:center;gap:.45rem;font-size:.6rem;font-weight:700;letter-spacing:.16em;color:var(--kraft-deep);margin:1rem 0 .4rem;}.lblrow .hint{font-weight:500;letter-spacing:.03em;text-transform:none;color:var(--ink-faint);font-size:.52rem;margin-left:.1rem;}.focuscard{display:flex;align-items:flex-start;gap:.5rem;border-left:3px solid var(--amber);}.focus-text{flex:1;font-size:.84rem;color:var(--ink);outline:none;border-radius:2px;padding:.05rem .15rem;}.focus-text:focus{background:#fff7e6;box-shadow:0 0 0 1px var(--amber);}.fpen{font-size:.7rem;color:var(--amber);opacity:.6;flex:none;}
.asana-badge{font-size:.5rem;background:var(--amber);color:#fff;padding:.1rem .35rem;border-radius:2px;letter-spacing:.1em;}
.card{background:#fffdf6;border:1px solid var(--paper-line);border-radius:3px;padding:.6rem .75rem;box-shadow:var(--shadow-card);}
.wt-card{background:#fffdf6;border:1px solid var(--paper-line);border-left:3px solid var(--moss);border-radius:3px;padding:.55rem .7rem;margin-bottom:.5rem;box-shadow:var(--shadow-card);}
.wt-card.over{border-left-color:var(--stamp-red);}
.wt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;}
.wt-name{font-size:.95rem;font-weight:700;color:var(--ink);line-height:1.12;font-family:'League Spartan',sans-serif;}
.wt-fin{font-family:var(--mono);font-size:.54rem;color:var(--kraft-deep);text-align:right;white-space:nowrap;line-height:1.3;}
.wt-owner{display:inline-block;font-size:.55rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--kraft-deep);background:#f3e8cf;border:1px solid var(--paper-line);border-radius:3px;padding:.08rem .38rem;margin-top:.35rem;}
.wt-next{display:flex;align-items:flex-start;gap:.4rem;margin-top:.5rem;padding-top:.45rem;border-top:1px dashed var(--paper-line);}
.wt-dot{flex:none;width:.62rem;height:.62rem;border-radius:50%;margin-top:.18rem;background:var(--phosphor);box-shadow:0 0 5px var(--phosphor-dim);}
.wt-card.over .wt-dot{background:var(--stamp-red);box-shadow:none;}
.wt-nl{font-size:.5rem;font-weight:700;letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase;}
.wt-nt{font-size:.82rem;color:var(--ink);line-height:1.28;}
.wt-over{display:inline-block;font-family:var(--mono);font-size:.56rem;color:var(--stamp-red);margin-top:.18rem;}
.sigrow{display:flex;align-items:center;justify-content:space-between;}
.sigbars{letter-spacing:-1px;font-weight:700;}
.touched{font-size:.66rem;font-weight:700;letter-spacing:.08em;}
.ta{width:100%;resize:none;border:1px solid var(--paper-line);border-radius:3px;background:#fff;font-family:var(--mono);font-size:.82rem;color:var(--ink);padding:.5rem .6rem;min-height:54px;margin-top:.3rem;}
.btnrow{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem;}
.btn{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.08em;border-radius:3px;padding:.45rem .7rem;cursor:pointer;border:1px solid var(--kraft-dark);background:transparent;color:var(--ink-soft);}
.btn.dark{background:var(--ink);color:var(--paper);border:none;}
.btn.stamp{background:var(--stamp-red);color:#fff;border:none;}

/* inbox subsections */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.4rem;}
.tile{border:1px solid var(--paper-line);border-radius:3px;padding:.5rem .6rem;background:#fffdf6;}
.tile .s{font-size:.58rem;font-weight:700;letter-spacing:.1em;color:var(--ink-faint);}
.tile .v{font-size:1.05rem;font-weight:700;margin-top:.15rem;}
.tile .v.hot{color:var(--stamp-red);}
.tile small{display:block;font-size:.54rem;color:var(--ink-faint);letter-spacing:.04em;font-weight:500;}
.commit{padding:.6rem .1rem;border-bottom:1px solid var(--paper-line);}
.commit .q{font-size:.84rem;}
.commit .src{font-size:.58rem;color:var(--ink-faint);letter-spacing:.06em;margin-top:.1rem;}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.45rem;}
.chips button{font-family:var(--mono);font-size:.58rem;font-weight:700;letter-spacing:.04em;border:1px solid var(--kraft-dark);background:transparent;color:var(--ink-soft);border-radius:3px;padding:.3rem .55rem;cursor:pointer;}
.chips button.mine{border-color:var(--stamp-red);color:var(--stamp-red);}
.commit.done{opacity:.5;}.commit.done .chips{display:none;}
.filed{display:none;font-size:.6rem;font-weight:700;color:var(--green);margin-top:.4rem;letter-spacing:.06em;}
.commit.done .filed{display:block;}
.anchor{margin-top:1.1rem;background:#efe6cf;border:1px solid var(--paper-line);border-radius:3px;padding:.7rem .85rem;transform:rotate(.3deg);}
.anchor .al{font-size:.54rem;font-weight:700;letter-spacing:.18em;color:var(--kraft-deep);}
.anchor blockquote{font-size:.82rem;font-style:italic;color:var(--ink-soft);margin-top:.3rem;}
:focus-visible{outline:2px solid var(--stamp-red);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){#scope-sweep{animation:none;}.scope-lamp,.scope-scanlines{animation:none;}}

/* ===== SHEPHERDING · PRAYER ROOM (scoped) ===== */
.prroom{margin-top:.3rem;}
.prroom .plates{display:flex;gap:.5rem;margin:.15rem 0 .95rem;}
.prroom .plate{flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.12rem;padding:.62rem .4rem;border-radius:5px;border:1px solid #2c3020;color:#e9ecd9;position:relative;
  background:
   radial-gradient(circle at 7px 7px, rgba(0,0,0,.6) 0 1.6px, rgba(255,255,255,.12) 2px 2.6px, transparent 3px),
   radial-gradient(circle at calc(100% - 7px) 7px, rgba(0,0,0,.6) 0 1.6px, rgba(255,255,255,.12) 2px 2.6px, transparent 3px),
   radial-gradient(circle at 7px calc(100% - 7px), rgba(0,0,0,.6) 0 1.6px, rgba(255,255,255,.12) 2px 2.6px, transparent 3px),
   radial-gradient(circle at calc(100% - 7px) calc(100% - 7px), rgba(0,0,0,.6) 0 1.6px, rgba(255,255,255,.12) 2px 2.6px, transparent 3px),
   linear-gradient(157deg, var(--olive-hi), var(--olive) 55%, var(--olive-dk));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), inset 0 -3px 7px rgba(0,0,0,.4), 0 2px 0 #23271a;
  transition:transform .1s, box-shadow .12s, filter .12s;}
.prroom .plate:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 1px 0 #23271a;}
.prroom .plate .pl-n{font-family:'Special Elite',monospace;font-size:.58rem;color:var(--scope-amber);opacity:.8;}
.prroom .plate .pl-t{font-family:'League Spartan',sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;text-shadow:0 1px 0 rgba(0,0,0,.55);}
.prroom .plate.on{filter:brightness(1.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 0 0 1.5px var(--scope-amber), 0 3px 9px rgba(0,0,0,.32);}
.prroom .plate.on .pl-n{opacity:1;}
.prroom .plate.on .pl-t{color:#fff;}
.prroom .so{background:#fbf6e9;border:1px solid #2c2f22;border-left:3px solid var(--moss);border-radius:3px;padding:.5rem .7rem;margin:.2rem 0 .9rem;font-family:'Special Elite',monospace;font-size:.72rem;line-height:1.55;color:var(--ink-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);}
.prroom .so .r{display:block;margin-top:.3rem;font-family:'League Spartan',sans-serif;font-size:.56rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
.prroom .ptabs{display:flex;gap:.5rem;margin-bottom:.7rem;}
.prroom .ptab{flex:1;cursor:pointer;font-family:'League Spartan',sans-serif;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:.42rem .5rem;border:1px solid var(--kraft-dark);border-top:3px solid var(--kraft);border-radius:6px 6px 2px 2px;background:#fbf4e2;color:var(--ink-faint);box-shadow:inset 0 -6px 8px -6px rgba(0,0,0,.18);}
.prroom .ptab .ct{display:block;font-size:.52rem;font-weight:400;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:.05rem;}
.prroom .ptab.on{background:#fffdf6;color:var(--ink);transform:translateY(-2px);box-shadow:0 4px 9px rgba(60,42,18,.2);}
.prroom .ptab.on .ct{color:var(--stamp-red);}
.prroom .stage{position:relative;}
.prroom .draw{position:absolute;left:5px;right:5px;top:7px;bottom:-5px;border-radius:7px;background:#f3ead2;border:1px solid var(--kraft-dark);z-index:0;}
.prroom .draw.two{left:9px;right:9px;top:12px;opacity:.6;}
.prroom .pcard{position:relative;z-index:2;background:var(--paper);border:1px solid var(--kraft-dark);border-top:3px solid var(--band,var(--moss));border-radius:7px;box-shadow:0 6px 15px rgba(38,25,9,.30),inset 0 1px 0 rgba(255,255,255,.55);padding:.85rem .95rem .95rem;overflow:hidden;transition:transform .42s cubic-bezier(.2,.7,.3,1),opacity .42s;}
.prroom .pcard.leaving{transform:translateY(-24px) rotate(1.5deg);opacity:0;}
.prroom .pcard.entering{transform:translateY(20px);opacity:0;}
.prroom .lens{font-family:'League Spartan',sans-serif;font-size:.6rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
.prroom .who{font-size:1.4rem;font-weight:700;line-height:1.14;margin:.16rem 0 .04rem;color:var(--ink);}
.prroom .who .ar{color:var(--kraft-deep);font-weight:400;padding:0 .16em;}
.prroom .sub{font-style:italic;font-size:.9rem;color:var(--ink-soft);}
.prroom .meta{display:flex;flex-wrap:wrap;gap:.35rem .45rem;margin-top:.7rem;}
.prroom .chip{font-size:.62rem;font-weight:600;color:var(--ink-soft);background:#f4ead4;border:1px solid var(--kraft-dark);border-radius:20px;padding:.16rem .55rem;}
.prroom .chip.rcp{color:#566b3a;border-color:#bcc69e;background:#eef1e3;}
.prroom .chip.wait{color:var(--ink-faint);background:transparent;}
.prroom .chip.live{color:#3c6b3a;border-color:#b6c79a;background:#eaf0df;font-weight:700;}
.prroom .chip.sample{color:var(--ink-faint);border-style:dashed;background:transparent;}
.prroom .log{margin-top:.7rem;font-family:'Special Elite',monospace;font-size:.72rem;line-height:1.55;color:var(--ink-soft);background:#fbf6e9;border:1px dashed var(--kraft-dark);border-radius:3px;padding:.45rem .6rem;}
.prroom .log b{display:block;font-family:'League Spartan',sans-serif;font-size:.56rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.2rem;}
.prroom .step{margin-top:.55rem;font-size:.94rem;color:var(--ink);display:flex;gap:.45rem;align-items:flex-start;}
.prroom .step .pin{color:var(--stamp-red);font-weight:700;flex:none;}
.prroom .nudge{margin-top:.65rem;font-family:'Special Elite',monospace;font-size:.8rem;line-height:1.4;color:var(--stamp-red);display:flex;gap:.45rem;align-items:center;}
.prroom .nudge .dot{width:6px;height:6px;border-radius:50%;background:var(--stamp-red);flex:none;}
.prroom .digin{margin-top:.75rem;}
.prroom .digin summary{list-style:none;cursor:pointer;font-family:'League Spartan',sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--green);display:inline-flex;align-items:center;gap:.35rem;}
.prroom .digin summary::-webkit-details-marker{display:none;}
.prroom .digin .body{margin-top:.5rem;border-top:1px solid var(--paper-line);padding-top:.55rem;}
.prroom .digin .row{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-soft);padding:.18rem 0;border-bottom:1px dotted var(--paper-line);}
.prroom .digin .row span:first-child{color:var(--ink-faint);}
.prroom .door{display:inline-block;margin-top:.55rem;font-family:'League Spartan',sans-serif;font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid var(--kraft-dark);border-radius:4px;padding:.3rem .55rem;background:#fbf4e2;}
.prroom .door:hover{border-color:var(--green);color:var(--green);}
.prroom .stamp{position:absolute;top:30%;right:7%;transform:rotate(-13deg);font-family:'Special Elite',monospace;color:var(--stamp-red);border:3px double var(--stamp-red);border-radius:6px;padding:.1rem .5rem;font-size:1.05rem;letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .18s;z-index:5;mix-blend-mode:multiply;}
.prroom .pcard.praying .stamp{opacity:.85;}
.prroom .pray{margin-top:1rem;width:100%;cursor:pointer;font-family:'League Spartan',sans-serif;font-size:.84rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#f7f4ea;background:linear-gradient(#7f8c5a,#6b774c);border:1px solid #4f5a36;border-radius:6px;padding:.7rem;box-shadow:0 2px 0 #46512f;}
.prroom .pray:active{transform:translateY(1px);box-shadow:0 1px 0 #46512f;}
.prroom .ondeck{margin-top:.9rem;border-top:1px solid var(--paper-line);padding-top:.55rem;display:flex;align-items:baseline;gap:.5rem;}
.prroom .ondeck .lbl{font-family:'League Spartan',sans-serif;font-size:.58rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap;}
.prroom .ondeck .nx{font-style:italic;font-size:.9rem;color:var(--ink-soft);flex:1;}
.prroom .ondeck .ct2{font-size:.62rem;color:var(--ink-faint);white-space:nowrap;}
.prroom .foot{margin-top:.85rem;font-size:.58rem;color:var(--ink-faint);line-height:1.5;}
.prroom .praydoor{display:flex;flex-direction:column;gap:.12rem;width:100%;text-align:left;cursor:pointer;margin:.3rem 0 1rem;padding:.7rem .85rem;border:1px solid #4f5a36;border-radius:7px;background:linear-gradient(#7f8c5a,#6b774c);box-shadow:0 2px 0 #46512f;color:#f7f4ea;}
.prroom .praydoor:active{transform:translateY(1px);box-shadow:0 1px 0 #46512f;}
.prroom .pd-k{font-family:'League Spartan',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.prroom .pd-s{font-size:.72rem;opacity:.92;}
.prroom .feed{background:var(--paper);border:1px solid var(--kraft-dark);border-left:3px solid var(--moss);border-radius:6px;padding:.6rem .75rem .65rem;margin-bottom:.7rem;box-shadow:0 2px 6px rgba(38,25,9,.12);}
.prroom .feedhead{display:flex;align-items:center;gap:.5rem;}
.prroom .fname{font-family:'League Spartan',sans-serif;font-size:.92rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);}
.prroom .fsrc{font-family:'League Spartan',sans-serif;font-size:.54rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--paper-line);border-radius:20px;padding:.1rem .45rem;}
.prroom .feedstep{margin-top:.45rem;font-size:.95rem;color:var(--ink);display:flex;gap:.45rem;align-items:flex-start;}
.prroom .feedstep .pin{color:var(--stamp-red);font-weight:700;flex:none;}
.prroom .feedmeta{margin-top:.3rem;font-size:.7rem;color:var(--ink-faint);}
.prroom .back{display:inline-block;margin-bottom:.7rem;font-family:'League Spartan',sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green);text-decoration:none;}
.prroom .chip.ai{color:var(--kraft-deep);border-color:var(--kraft-dark);background:#f3ead2;font-weight:700;letter-spacing:.02em;}
.prroom .aisum{margin-top:.5rem;background:#fbf6e9;border:1px dashed var(--kraft-dark);border-radius:4px;padding:.5rem .6rem .55rem;}
.prroom .aih{font-family:'League Spartan',sans-serif;font-size:.54rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.15rem;}
.prroom .aisum p{font-size:.78rem;line-height:1.5;color:var(--ink-soft);margin:.35rem 0 0;}
.fm-sec{margin-top:.8rem;}.fm-sec:first-child{margin-top:0;}
.fm-h{display:flex;align-items:baseline;gap:.42rem;font-family:'League Spartan',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--kraft-deep);border-bottom:1px solid var(--kraft-dark);padding-bottom:.22rem;}
.fm-n{font-family:'Special Elite',monospace;font-size:.58rem;font-weight:400;letter-spacing:.02em;color:var(--stamp-red);flex:none;}
.fm-items{margin:.3rem 0 0;padding-left:.6rem;}
.fm-i{display:flex;flex-wrap:wrap;gap:.1rem .45rem;align-items:baseline;padding:.14rem 0;font-size:.8rem;line-height:1.35;color:var(--ink);}
.fm-b{flex:none;color:var(--kraft-dark);}
.fm-t{flex:1;min-width:60%;}
.fm-m{font-family:'Special Elite',monospace;font-size:.62rem;color:var(--ink-faint);}


/* ===== THE WAR ROOM (strategy) — scoped, wr- prefixed ===== */
#war-room{--wr-kraft:#C4A87C;--wr-kraftd:#9C7A4D;--wr-kraftp:#6E5631;--wr-paperline:#D9C9A8;
  --wr-ink:#3b2f1d;--wr-inksoft:#4a3f2c;--wr-inkfaint:#9C7A4D;--wr-stamp:#C2702F;--wr-amber:#D08A3E;
  --wr-aqua:#7B9BA8;--wr-moss:#8A9A6B;--wr-green:#7F9056;--wr-phos:#58ffb0;--wr-phosd:#2fae78;
  --wr-bk:#2a2622;--wr-bkhi:#463f37;
  font-family:'League Spartan',system-ui,sans-serif;color:#f1ead7;
  background:linear-gradient(160deg,#5f6142,#494a32);border:1px solid #2c2c1d;border-radius:12px;
  padding:12px 11px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 26px rgba(0,0,0,.4)}
#war-room *{box-sizing:border-box}
#war-room .wr-plate{background:linear-gradient(160deg,var(--wr-bkhi),var(--wr-bk));border:1px solid #15110d;
  border-radius:7px;padding:.5rem .7rem;margin-bottom:.55rem;box-shadow:inset 0 2px 8px rgba(0,0,0,.6)}
#war-room .wr-pr{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
#war-room .wr-mfr{font-size:.5rem;font-weight:700;letter-spacing:.22em;color:var(--wr-amber);opacity:.85}
#war-room .wr-no{font-family:'Special Elite',monospace;font-size:.54rem;color:#cdbb86;opacity:.8}
#war-room .wr-h1{font-size:1.05rem;font-weight:800;letter-spacing:.13em;color:#f3ecda;margin:.2rem 0 0;text-transform:uppercase}
/* swap toggle */
#war-room .wr-swap{display:flex;gap:0;margin:.1rem 0 .55rem;background:#3f4030;border:1px solid #2c2c1d;border-radius:7px;padding:3px}
#war-room .wr-swap button{flex:1;font-family:'League Spartan',sans-serif;font-weight:800;letter-spacing:.12em;font-size:.66rem;
  text-transform:uppercase;color:#bdb088;background:transparent;border:0;border-radius:5px;padding:.42rem 0;cursor:pointer}
#war-room .wr-swap button.on{background:linear-gradient(160deg,#6a6c4a,#54563a);color:#f3ecda;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
/* capture + route (static shell — wired in Pass 2) */
#war-room .wr-addbar{margin:.9rem 0 .2rem;background:#3f4030;border:1px dashed #6f6a4a;border-radius:6px;padding:.45rem .55rem}
#war-room .wr-abtop{display:flex;gap:.4rem;align-items:center}
#war-room .wr-plus{font-size:1rem;color:var(--wr-amber);font-weight:800;line-height:1}
#war-room .wr-ph{flex:1;font-size:.74rem;color:#bdb088;font-style:italic}
#war-room .wr-routes{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.45rem}
#war-room .wr-chip{font-family:'Special Elite',monospace;font-size:.5rem;letter-spacing:.03em;padding:.13rem .4rem;
  border-radius:3px;border:1px solid #6f6a4a;color:#e7dcbf;background:#494a32}
#war-room .wr-chip.exit{border-style:dashed;color:#cdbb86;background:transparent}
/* altitude tiers */
#war-room .wr-tier{display:flex;gap:.45rem;align-items:stretch}
#war-room .wr-rail{cursor:pointer;flex:none;width:14px;position:relative;display:flex;flex-direction:column;align-items:center;padding-top:.15rem}
#war-room .wr-rail::before{content:"";position:absolute;top:0;bottom:-.1rem;left:50%;width:2px;margin-left:-1px;

function wrRenderNow(q1){
  var el=document.getElementById('wr-now'); if(!el) return;
  var t=new Date(), today=t.getFullYear()+"-"+("0"+(t.getMonth()+1)).slice(-2)+"-"+("0"+t.getDate()).slice(-2);
  var due=(q1||[]).map(function(o){return o.it;})
    .filter(function(it){ return it.due && it.due<=today; })
    .sort(function(a,b){ return a.due<b.due?-1:(a.due>b.due?1:0); });
  if(!due.length){
    el.innerHTML="<div class='wr-now calm'><span class='wr-ndot'></span><span class='wr-nlbl'>CLEAR</span>"+
      "<span class='wr-ns'>Nothing's due today. That means the War Table \u2014 go do the work that wins.</span></div>";
    return;
  }
  el.innerHTML="<div class='wr-nowhd'>"+due.length+" with the clock run out \u2014 from Under Fire</div>"+
    due.map(function(it){
      var over=(it.due<today);
      return "<div class='wr-now"+(over?"":" soon")+"'><span class='wr-ndot'></span>"+
        "<span class='wr-nlbl'>"+(over?"OVERDUE":"TODAY")+"</span>"+
        "<span class='wr-ns'>"+prEsc(it.label)+

              return "<div class='fm-i'><span class='fm-b'>\u2013</span><span class='fm-t'>"+prEsc(t.name)+"</span>"+meta+"</div>";
            }).join("")+
          "</div></div>";
        }).join(""); }
      } }catch(e){}
      try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s);
    };
    s.src=PROXY_URL+'?action=disciples&token='+encodeURIComponent(PROXY_TOKEN)+'&callback='+cb;
    s.onerror=function(){ var el=document.getElementById('disc-feed'); if(el)el.innerHTML="<div style='color:var(--ink-faint)'>Couldn\u2019t reach Asana.</div>"; try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); };
    (document.head||document.body).appendChild(s);
  }catch(e){}
}

function tbSave(){
  var el=document.getElementById('tb-input'); var v=el?((el.value||'').trim()):'';
  if(!v) return;
  try{ localStorage.setItem('hub.token', v); }catch(e){}
  location.reload();
}
function wrTokenBar(){
  try{ if(!PROXY_TOKEN){ var b=document.getElementById('tokbar'); if(b) b.classList.add('show'); } }catch(e){}
}
fetchHub();
fetchScope();
fetchInboxCount();
var SCOPE_DATA={};
function applyScope(sp){
  var map={}; sp.forEach(function(x){map[x.spoke]=x;});
  S.forEach(function(s){
    var sn=scopeName(s.n); if(!sn||!map[sn]) return;
    var x=map[sn];
    if(x.resting){ s.v=5; return; }
    if(typeof x.score==='number'){ s.v=x.score; return; }
    var pos; if(x.daysQuiet==null) pos=0; else { pos=1-(x.daysQuiet/(x.threshold||14)); if(pos<0)pos=0; if(pos>1)pos=1; }
    s.v=Math.round(pos*10);
  });
  sh.setAttribute("points",S.map(function(s,i){var p=pt(i,R*s.v/10);return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" "));
  dt.querySelectorAll('circle').forEach(function(c){var i=+c.getAttribute('data-i');var p=pt(i,R*S[i].v/10);c.setAttribute('cx',p[0].toFixed(1));c.setAttribute('cy',p[1].toFixed(1));c.setAttribute('r',S[i].v<=3?5:3.4);});
  var avg=document.getElementById('avg'); if(avg) avg.textContent=(S.reduce(function(a,s){return a+s.v;},0)/N).toFixed(1);
}
function fmtHrs_(h){ return (h%1===0 ? h.toFixed(0) : h.toFixed(1)) + "h"; }
function buildScopeStrip(i){
  var s=S[i], sn=scopeName(s.n); if(!sn) return "";
  var sc=SCOPE_DATA[sn];
  var fresh = sc ? (sc.resting?"Resting \u2014 set down on purpose":(sc.daysQuiet==null?"No signal yet":(sc.daysQuiet===0?"Tended today":("Tended "+sc.daysQuiet+" day"+(sc.daysQuiet===1?'':'s')+" ago")))) : "\u2014";
  var out = "<div style='margin:.1rem 0 .35rem;font-size:.74rem;color:var(--ink-soft)'>"+fresh+"</div>";
  // Hours this week = Otter + calendar (auto, once the sweep runs) plus what you log
  // by hand. Shown only when there's time to show \u2014 a spoke nobody has fed simply
  // stays quiet here instead of reading as a zero. Grace, not guilt.
  var hrs = (sc && typeof sc.hours==='number') ? sc.hours : 0;
  var oMin = (sc && sc.otterMinutes) || 0, mMin = (sc && sc.manualMinutes) || 0;
  var prevH = (sc && sc.prevMinutes>0) ? Math.round(sc.prevMinutes/6)/10 : 0;
  if(hrs>0 || prevH>0){
    var tip = "Time this week: Otter recordings + calendar, plus anything you log by hand. Prayer, reading, and quiet time aren\u2019t heard automatically \u2014 a low number isn\u2019t an absent week.";
    var body = hrs>0 ? "<b style='font-weight:700;color:var(--ink)'>"+fmtHrs_(hrs)+"</b> this week" : "none caught this week";
    if(hrs>0 && mMin>0 && oMin>0) body += " <span style='opacity:.7'>\u00b7 "+fmtHrs_(Math.round(mMin/6)/10)+" by hand</span>";
    if(prevH>0) body += " <span style='opacity:.7'>\u00b7 last wk "+fmtHrs_(prevH)+"</span>";
    out += "<div title=\""+tip+"\" style='margin:-.2rem 0 .35rem;font-size:.72rem;color:var(--ink-soft);display:flex;align-items:center;gap:.3rem;cursor:help'>"
        +  "<span style='opacity:.6'>\u23f1</span><span>"+body+"</span></div>";
  }
  // Log time by hand \u2014 always here, so a quiet spoke can still be fed. This is the
  // floor that makes the readout real before the weekly sweep is wired.
  var chip = "font:inherit;font-size:.62rem;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);background:#efe7d4;border:1px solid #d8d0bd;border-radius:4px;padding:.12rem .42rem;cursor:pointer";
  out += "<div class='logtime' style='display:flex;align-items:center;flex-wrap:wrap;gap:.28rem;margin:.1rem 0 .55rem'>"
      +  "<span style='opacity:.65;letter-spacing:.12em;text-transform:uppercase;font-size:.56rem;color:var(--ink-soft);margin-right:.05rem'>log time</span>"
      +  "<button onclick='logTime("+i+",15,this)' style=\""+chip+"\">+15m</button>"
      +  "<button onclick='logTime("+i+",30,this)' style=\""+chip+"\">+30m</button>"
      +  "<button onclick='logTime("+i+",60,this)' style=\""+chip+"\">+1h</button>"
      +  "<button onclick='logTime("+i+",120,this)' style=\""+chip+"\">+2h</button>"
      +  "<input id='lt-"+i+"' type='number' min='1' inputmode='numeric' placeholder='min' style='width:3rem;font:inherit;font-size:.62rem;padding:.1rem .25rem;border:1px solid #d8d0bd;border-radius:4px;background:#fbf7ec;color:var(--ink)'/>"
      +  "<button onclick='logTimeCustom("+i+",this)' style=\""+chip+"\">add</button>"
      +  "<span class='ltmsg' style='font-size:.6rem;color:var(--ink-soft);opacity:.85'></span>"
      +  "</div>";
  return out;
}
function restLamp(i){
  var s=S[i], sn=scopeName(s.n); if(!sn) return "";
  var sc=SCOPE_DATA[sn], resting=sc&&sc.resting;
  var c = resting?'var(--amber)':'#7a7a5f', fill=resting?'#f6ecd6':'transparent', kx=resting?23:9, lbl=resting?'STBY':'ON';
  var svg="<svg width='34' height='16' viewBox='0 0 34 16' style='display:block'>"+
    "<rect x='1' y='2' width='32' height='12' rx='6' fill='"+fill+"' stroke='"+c+"' stroke-width='1.4'/>"+
    "<circle cx='"+kx+"' cy='8' r='4.3' fill='"+c+"'/>"+
  "</svg>";
  return "<span class='restsw' title='"+(resting?'standby \u2014 tap to bring active':'tap to set this spoke standby (resting)')+"' onclick=\"toggleRest("+i+","+(resting?'false':'true')+",this)\" style='cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;flex:none;margin-right:.4rem;gap:1px'>"+svg+"<span style='font-size:.46rem;font-weight:800;letter-spacing:.14em;color:"+c+"'>"+lbl+"</span></span>";
}
function toggleRest(i,on,btn){
  var s=S[i], sn=scopeName(s.n); if(!sn) return;
  var msg=btn.parentNode.querySelector('.restmsg'); if(msg)msg.textContent='\u2026';
  var cb='rsCb_'+Date.now(), sc=document.createElement('script');
  window[cb]=function(d){ if(d&&d.ok){ if(!SCOPE_DATA[sn])SCOPE_DATA[sn]={spoke:sn}; SCOPE_DATA[sn].resting=d.resting; fetchScope(); select(i); } else { if(msg)msg.textContent='Failed'; } try{delete window[cb];}catch(e){} if(sc.parentNode)sc.parentNode.removeChild(sc); };
  sc.onerror=function(){ if(msg)msg.textContent='No reach'; try{delete window[cb];}catch(e){} if(sc.parentNode)sc.parentNode.removeChild(sc); };
  sc.src=PROXY_URL+'?action=rest&spoke='+encodeURIComponent(sn)+'&on='+(on?'1':'0')+'&token='+encodeURIComponent(PROXY_TOKEN)+'&callback='+cb;
  (document.head||document.body).appendChild(sc);
}
function logTime(i,mins,btn){
  var s=S[i], sn=scopeName(s.n); if(!sn) return;
  var msg=btn.parentNode.querySelector('.ltmsg'); if(msg)msg.textContent='\u2026';
  var cb='ltCb_'+Date.now(), sc=document.createElement('script');
  window[cb]=function(d){
    if(d&&d.ok){
      if(!SCOPE_DATA[sn])SCOPE_DATA[sn]={spoke:sn};
      SCOPE_DATA[sn].minutes=d.minutes; SCOPE_DATA[sn].hours=d.hours;
      SCOPE_DATA[sn].otterMinutes=d.otterMinutes; SCOPE_DATA[sn].manualMinutes=d.manualMinutes;
      fetchScope(); select(i);
    } else { if(msg)msg.textContent=(d&&d.error)||'failed'; }
    try{delete window[cb];}catch(e){} if(sc.parentNode)sc.parentNode.removeChild(sc);
  };
  sc.onerror=function(){ if(msg)msg.textContent='no reach'; try{delete window[cb];}catch(e){} if(sc.parentNode)sc.parentNode.removeChild(sc); };
  sc.src=PROXY_URL+'?action=addtime&spoke='+encodeURIComponent(sn)+'&minutes='+encodeURIComponent(mins)+'&token='+encodeURIComponent(PROXY_TOKEN)+'&callback='+cb;
  (document.head||document.body).appendChild(sc);
}
function logTimeCustom(i,btn){
  var inp=document.getElementById('lt-'+i); if(!inp) return;
  var v=parseInt(inp.value,10); if(isNaN(v)||v===0){ inp.focus(); return; }
  inp.value=''; logTime(i,v,btn);
}
var CNT_IDEAS=null, CNT_IDEAS_DUE=null, IDEAS=[];
function fetchIdeas(){
  try{
    var cb='idCb_'+Date.now(), sc=document.createElement('script');
    window[cb]=function(d){
      try{ IDEAS=(d&&d.ideas)||[]; CNT_IDEAS=IDEAS.length;
        var _t=new Date(), _td=_t.getFullYear()+"-"+("0"+(_t.getMonth()+1)).slice(-2)+"-"+("0"+_t.getDate()).slice(-2);
        CNT_IDEAS_DUE=IDEAS.filter(function(x){ return x.due && x.due<=_td; }).length;
        refreshCounts();
        if(document.getElementById('id-list')) renderIdeas();
      }catch(e){}
      try{delete window[cb];}catch(e){} if(sc.parentNode)sc.parentNode.removeChild(sc);
    };
    sc.src=PROXY_URL+'?action=inbox&token='+encodeURIComponent(PROXY_TOKEN)+'&callback='+cb;
    sc.onerror=function(){ try{delete window[cb];}catch(e){} if(sc.parentNode)sc.parentNode.removeChild(sc); };
    (document.head||document.body).appendChild(sc);
  }catch(e){}
}
function openIdeas(){
  clearActive();
  var b=document.querySelector('.toc-item.idea'); if(b)b.classList.add('active');
  recno.textContent="RECORD: IDEAS";
  panel.className="panel show";
  panel.innerHTML=
    "<div class='p-head'><div style='flex:1'><h3>IDEAS</h3></div></div>"+
    "<div class='id-rule'>Nothing here is a task. An idea leaves this list one of two ways \u2014 through the gate, or dropped. Most should be dropped.</div>"+
    "<div id='id-list' class='card' style='font-size:.82rem'><span style='color:var(--ink-faint)'>\u2026</span></div>"+
    "<div style='display:flex;gap:.4rem;margin-top:.5rem'><input id='id-add' placeholder='+ a thought worth keeping\u2026' style='flex:1;box-sizing:border-box;padding:.45rem;border:1px solid var(--paper-line);border-radius:4px;font:inherit'/><button class='btn stamp' onclick='addIdea()'>KEEP</button></div>"+
    "<div id='id-msg' style='font-size:.7rem;color:var(--ink-soft);margin-top:.35rem;min-height:1em'></div>";
  renderIdeas(); fetchIdeas();
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function renderIdeas(){
  var el=document.getElementById('id-list'); if(!el) return;
  if(!IDEAS.length){ el.innerHTML="<span style='color:var(--ink-faint)'>Empty. That's a good state.</span>"; return; }
  var t=new Date(), today=t.getFullYear()+"-"+("0"+(t.getMonth()+1)).slice(-2)+"-"+("0"+t.getDate()).slice(-2);
  var sorted=IDEAS.slice().sort(function(a,b){
    var ad=a.due||'9999-99-99', bd=b.due||'9999-99-99'; return ad<bd?-1:(ad>bd?1:0); });
  el.innerHTML=sorted.map(function(it){
    var dueTag = it.due
      ? ("<span class='id-due"+(it.due<=today?' now':'')+"'>"+(it.due<=today?'revisit now':('revisit '+wtDate(it.due)))+"</span>")
      : "<span class='id-due none'>no revisit set</span>";
    return "<div class='id-row' data-gid='"+it.gid+"'>"+
      "<div class='id-line'><span class='id-t'>"+prEsc(it.name)+"</span>"+dueTag+"</div>"+
      "<div class='id-acts'>"+
        "<button class='mv-chip' onclick=\"ideaRevisit('"+it.gid+"',30,this)\">1 month</button>"+
        "<button class='mv-chip' onclick=\"ideaRevisit('"+it.gid+"',90,this)\">3 months</button>"+
        "<button class='mv-chip cancel' onclick=\"dropIdea('"+it.gid+"',this)\">drop</button>"+
      "</div></div>";
  }).join("");
}
function addIdea(){
  var i=document.getElementById('id-add'), m=document.getElementById('id-msg');
  var t=(i&&i.value||'').trim(); if(!t){ if(m)m.textContent='type it first.'; return; }
  if(m)m.textContent='keeping\u2026';
  wrJsonp('action=addtask&section=IDEAS&name='+encodeURIComponent(t), function(d){
    if(d&&d.ok){ if(i){i.value='';i.focus();} if(m)m.textContent='\u2713 kept.'; fetchIdeas(); }
    else { if(m)m.textContent="couldn\u2019t keep it \u2014 "+((d&&d.error)||'?'); }
  });
}
function ideaRevisit(gid,days,btn){
  var dt=new Date(Date.now()+days*86400000).toISOString().slice(0,10);
  var m=document.getElementById('id-msg'); if(m)m.textContent='setting\u2026';
  wrJsonp('action=later&task='+encodeURIComponent(gid)+'&date='+dt, function(d){
    if(d&&d.ok){ if(m)m.textContent='\u2713 back on '+dt+'.'; fetchIdeas(); }
    else if(m){ m.textContent="couldn\u2019t set \u2014 "+((d&&d.error)||'?'); }
  });
}
function dropIdea(gid,btn){
  var row=btn; while(row&&!(row.className&&/id-row/.test(row.className))) row=row.parentNode;
  if(row){ row.style.opacity='.4'; }
  wrJsonp('action=complete&task='+encodeURIComponent(gid), function(d){
    if(d&&d.ok){ IDEAS=IDEAS.filter(function(x){return x.gid!==gid;}); CNT_IDEAS=IDEAS.length; fetchIdeas(); renderIdeas(); }
    else if(row){ row.style.opacity=''; }
  });
}
function fetchInboxCount(){
  var cb='icCb_'+Date.now(), s=document.createElement('script');
  window[cb]=function(d){ try{ var _t=new Date(), _today=_t.getFullYear()+"-"+("0"+(_t.getMonth()+1)).slice(-2)+"-"+("0"+_t.getDate()).slice(-2); CNT_INBOX=((d&&d.items)||[]).filter(function(x){return !x.due||x.due<=_today;}).length; refreshCounts(); }catch(e){} try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); };
  s.onerror=function(){ try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); };
  s.src=PROXY_URL+'?action=chatinbox&token='+encodeURIComponent(PROXY_TOKEN)+'&callback='+cb;
  (document.head||document.body).appendChild(s);
}
function fetchScope(){
  var cb='scCb_'+Date.now(), s=document.createElement('script');
  window[cb]=function(d){
    try{
      var sp=(d&&d.spokes)||[];
      sp.forEach(function(x){SCOPE_DATA[x.spoke]=x;});
      applyScope(sp);
    }catch(e){}
    try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s);
  };
  s.onerror=function(){ try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); };
  s.src=PROXY_URL+'?action=scope&token='+encodeURIComponent(PROXY_TOKEN)+'&callback='+cb;
  (document.head||document.body).appendChild(s);
}
prFetchFlock();
fetchIdeas();
if(thGet()==='work') openWarRoom(true);
